<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Email Phishing Triage Console</title><desc id="desc">An offline analyst workbench: inspect messages, investigate evidence, document decisions.</desc><rect width="1280" height="360" rx="18" fill="#0e1520"/><rect x="45" y="45" width="7" height="270" rx="3" fill="#66e3c4"/><text x="85" y="85" fill="#66e3c4" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">SECURITY OPERATIONS / PORTFOLIO LAB</text><text x="85" y="151" fill="#e6edf5" font-family="Arial,sans-serif" font-size="42" font-weight="700">Email Phishing</text><text x="85" y="204" fill="#e6edf5" font-family="Arial,sans-serif" font-size="42" font-weight="700">Triage Console</text><text x="85" y="254" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Evidence before assumptions.</text><text x="85" y="302" fill="#66e3c4" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">LOCAL ANALYSIS · EXPLAINABLE RULES · ZERO API KEYS</text><g font-family="Arial,sans-serif"><rect x="820" y="64" width="380" height="65" rx="10" fill="#162230" stroke="#2b3b4c"/><text x="843" y="104" fill="#66e3c4" font-size="18">01</text><text x="889" y="104" fill="#dce6f3" font-size="18">Inspect the message</text><rect x="820" y="147" width="380" height="65" rx="10" fill="#162230" stroke="#2b3b4c"/><text x="843" y="187" fill="#66e3c4" font-size="18">02</text><text x="889" y="187" fill="#dce6f3" font-size="18">Investigate the evidence</text><rect x="820" y="230" width="380" height="65" rx="10" fill="#162230" stroke="#2b3b4c"/><text x="843" y="270" fill="#66e3c4" font-size="18">03</text><text x="889" y="270" fill="#dce6f3" font-size="18">Document the decision</text></g></svg>
