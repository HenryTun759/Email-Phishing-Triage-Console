<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabVuln Login</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;display:grid;place-items:center;min-height:100vh}form{background:#121a2e;padding:32px;border-radius:14px;width:min(360px,90vw)}input{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:10px;border-radius:8px;border:1px solid #33405f;background:#0b1020;color:white}button{width:100%;padding:11px;border:0;border-radius:8px;font-weight:700}.error{color:#ff9a9a}</style></head><body><form method="post" action="/login"><h1>LabVuln</h1><p>Authorized lab security console</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<label>Username</label><input name="username" required maxlength="80"><label>Password</label><input name="password" type="password" required minlength="8" maxlength="128"><button type="submit">Sign in</button></form></body></html>
